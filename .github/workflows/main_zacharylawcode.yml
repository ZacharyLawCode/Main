name: Build and Deploy

on:
  push:
    branches:
      - main
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v3  # Use latest stable version of checkout action

    # Setup Node.js version
    - name: Setup Node 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    # Install dependencies, build, and test
    - name: 'npm install, build, and test'
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    # Conditional deployment for different branches
    - name: 'Run Azure webapp deploy action using publish profile credentials'
      uses: azure/webapps-deploy@v2
      with:
        app-name: zacharylawcode
        publish-profile: ${{ secrets[github.event.ref == 'refs/heads/main' && 'main' || 'test'] }}


