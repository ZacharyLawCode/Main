name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write  # This is required for OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Specify that this job is for the production environment

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Login to Azure using Managed Identity (No need for client-id, secret, or tenant-id)
    - name: Login to Azure
      uses: azure/login@v2
      with:
        auth-type: 'IDENTITY'  # Use Managed Identity for authentication

    # Step 3: Deploy to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: "WebApp"  # Name of your Azure Web App
        package: .  # Path to your project or build output directory
