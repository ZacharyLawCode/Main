# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zacharylawcode

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # Ensure these secrets are correctly set
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} # Optional, but recommended for clarity

      - name: Deploy to Azure Web App (Test Branch)
        if: github.ref == 'refs/heads/test'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp-test
        with:
          app-name: 'zacharylawcodetest' # Replace with your test App Service name
          slot-name: 'Production'
          package: .

      - name: Deploy to Azure Web App (Main Branch)
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp-main
        with:
          app-name: 'zacharylawcode' # Replace with your production App Service name
          slot-name: 'Production'
          package: .
