name: Build and Deploy

on:
  push:
    branches:
      - main
      - test

jobs:
  # Test job
  test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'  # Runs only on the test branch

    steps:
      # Checkout the code from the repository
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      # Setup Node.js version
      - name: Setup Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install dependencies, build, and test
      - name: 'npm install, build, and test'
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      # Deploy to the test environment
      - name: 'Run Azure webapp deploy action using test publish profile'
        uses: azure/webapps-deploy@v2
        with:
          app-name: zacharylawcode
          publish-profile: ${{ secrets.test }}  # Test environment publish profile

  # Production job
  production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Runs only on the main branch

    steps:
      # Checkout the code from the repository
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      # Setup Node.js version
      - name: Setup Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install dependencies, build, and test
      - name: 'npm install, build, and test'
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      # Deploy to the production environment
      - name: 'Run Azure webapp deploy action using production publish profile'
        uses: azure/webapps-deploy@v2
        with:
          app-name: zacharylawcode
          publish-profile: ${{ secrets.prod }}  # Production environment publish profile
